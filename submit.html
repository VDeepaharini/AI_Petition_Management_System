<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Petition</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <h2>AI Petition</h2>

        </div>

        <div class="nav-right">

            <span class="nav-link"
                  onclick="goDashboard()">
                Dashboard
            </span>

            <button class="logout"
                    onclick="logoutUser()">
                Logout
            </button>

        </div>

    </nav>


    <!-- SUBMIT PETITION -->

    <main class="submit-container">

        <div class="submit-header">

            <h1>Submit a Petition</h1>

            <p>
                Submit your complaint, request or public issue.
                Provide the required details below.
            </p>

        </div>


        <div class="petition-form-box">

            <form id="petitionForm">


                <!-- TITLE -->

                <div class="form-group">

                    <label for="title">
                        Petition Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter petition title"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Infrastructure">
                            Infrastructure
                        </option>

                        <option value="Water Supply">
                            Water Supply
                        </option>

                        <option value="Electricity">
                            Electricity
                        </option>

                        <option value="Road">
                            Road
                        </option>

                        <option value="Sanitation">
                            Sanitation
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Petition Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Describe your complaint or request in detail..."
                        required
                    ></textarea>

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter the location related to the issue"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="goDashboard()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Submit Petition
                    </button>

                </div>

            </form>

        </div>

    </main>


    <footer>

        © 2026 AI Petition Management System

    </footer>


    <script src="script.js"></script>

</body>

</html>
