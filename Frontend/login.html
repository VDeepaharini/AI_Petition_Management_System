<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Petition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <h2>AI Petition</h2>
        </div>

        <h1>Welcome Back</h1>

        <p class="login-text">
            Login to manage and track your petitions.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
